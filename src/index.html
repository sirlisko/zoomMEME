<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZoomMEME</title>
  <meta name="author" content="sirlisko" />
  <link type="text/plain" rel="author" href="https://sirlisko.com/humans.txt" />
  <meta name="keywords" content="zoom, zoom-in, meme, generator" />
  <meta name="description" content="Super simple zoom-in meme generator." />
  <link rel="canonical" href="https://zoomme.me/">

  <meta property="og:url" content="https://zoomme.me" />
  <meta property="og:description" content="Super simple zoom-in meme generator." />
  <meta property="og:title" content="ZoomMEME" />
  <meta property="og:image" content="https://zoomme.me/icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
  <link href="/css/base.css" rel="stylesheet" />
  <link href="/css/landing.css" rel="stylesheet" />
  <link href="/css/editor.css" rel="stylesheet" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="60x60" href="/apple-touch-icon-60x60.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#2b59ff" />
  <meta name="theme-color" content="#2b59ff" />
</head>

<body>
  <header class="site-header">
    <p class="logo caption"><span class="logo__dot" aria-hidden="true"></span>ZoomME.ME</p>
    <a href="https://github.com/sirLisko/zoommeme">GitHub</a>
  </header>
  <p class="error" role="alert" hidden></p>
  <main class="landing" id="holder">
    <div class="landing__intro">
      <h1 class="landing__title caption">Make a zoom-in meme from any photo.</h1>
      <p class="landing__lede">Pick the spot, choose how far to zoom, and download frames that close in on it.</p>
      <div class="landing__actions">
        <label class="btn landing__pick">Choose a photo
          <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
        </label>
        <p class="landing__hint">or drop one here</p>
      </div>
      <p class="landing__note">JPEG, PNG, GIF or WebP. Your photo never leaves your device.</p>
    </div>
    <figure class="demo">
      <div class="demo__screen">
        <img class="demo__photo" alt="" />
        <div class="osd" aria-hidden="true">
          <div class="osd__top">
            <span class="osd__rec demo__rec">REC</span>
            <span class="osd__date"></span>
          </div>
          <span class="demo__zoom">
            <span>ZOOM 1×</span>
            <span>ZOOM 2×</span>
            <span>ZOOM 4×</span>
            <span>ZOOM 8×</span>
          </span>
        </div>
      </div>
      <figcaption class="demo__credit"><a></a></figcaption>
    </figure>
  </main>
  <article class="zoom" hidden>
    <ul class="zoom__box">
      <li>
        <button type="button" class="zoom__ctrl zoom__ctrl--out" aria-label="Zoom out">-</button>
        <p></p>
        <button type="button" class="zoom__ctrl zoom__ctrl--in" aria-label="Zoom in">+</button>
      </li>
      <li>
        <button type="button" class="zoom__ctrl zoom__ctrl--out" aria-label="Zoom out">-</button>
        <p></p>
        <button type="button" class="zoom__ctrl zoom__ctrl--in" aria-label="Zoom in">+</button>
      </li>
      <li>
        <button type="button" class="zoom__ctrl zoom__ctrl--out" aria-label="Zoom out">-</button>
        <p></p>
        <button type="button" class="zoom__ctrl zoom__ctrl--in" aria-label="Zoom in">+</button>
      </li>
      <li>
        <button type="button" class="zoom__ctrl zoom__ctrl--out" aria-label="Zoom out">-</button>
        <p></p>
        <button type="button" class="zoom__ctrl zoom__ctrl--in" aria-label="Zoom in">+</button>
      </li>
    </ul>
    <label class="zoom__checkbox"><input type="checkbox" name="watermark" id="watermark" checked />Allow
      watermark on generated image</label>
    <button type="button" class="zoom__save">Save Image</button>
  </article>
  <footer class="site-footer">
    <span>Made by <a href="https://sirlisko.com">sirlisko</a>, inspired by <a href="https://twitter.com/GianlucaMezzo">Gianluca Mezzo</a>.</span>
    <a href="https://github.com/sirLisko/zoommeme">Source on GitHub</a>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>

</html>
